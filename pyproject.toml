[project]
name = "metamorphosis-ai-chief-strategy-officer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.139.0",
    "pandas>=3.0.3",
    "pydantic-core>=2.46.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["allocate.py.py", "note.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM","FAST"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
addopts = "-q --strict-markers"
